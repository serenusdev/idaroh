name: IDAROH Weekly DB Backup

# Backup logis mingguan untuk Supabase Free plan (tanpa PITR/daily backup berbayar).
# Alur: supabase db dump (schema + data terpisah) -> gabung -> enkripsi age -> upload Backblaze B2 (S3-compatible).
#
# Secret wajib (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL        connection string SESSION POOLER (bukan direct; runner GH IPv4, direct Supabase IPv6-only)
#   AGE_RECIPIENT          public key age (age1...); private key disimpan operator offline, tidak di CI
#   B2_APPLICATION_KEY_ID  Backblaze B2 application keyID
#   B2_APPLICATION_KEY     Backblaze B2 applicationKey (secret, hanya tampil sekali)
#   B2_BUCKET              nama bucket B2 tujuan
#   B2_REGION              region bucket B2 (mis. us-west-004); menentukan endpoint S3
#
# Cakupan dump: skema public (tabel aplikasi + policy RLS + grants), app (helper/RPC), audit.
# auth.users dan Storage TIDAK ikut; lihat docs/backup-restore.md untuk batasan + auth dump terpisah.
# Restore: age -d lalu psql -v ON_ERROR_STOP=1 -f backup.sql. Dump data CLI sudah diawali
# "SET session_replication_role = replica;" (FK trigger mati) -> HANYA bisa dijalankan superuser;
# di Supabase hosted role postgres bukan superuser, jadi restore langsung ke project hosted ditolak.
# auth.users tidak ikut: pulihkan dulu, kalau tidak data aplikasi yatim. Cabut default privileges
# di target sebelum restore agar anon/authenticated tidak mewarisi hak penuh. Detail: docs/backup-restore.md.

on:
  schedule:
    # Minggu 17:00 UTC = Senin 00:00 WIB. Cadence < 7 hari juga menjaga project Free tidak di-pause karena idle.
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idaroh-db-backup
  cancel-in-progress: false

env:
  # Harus >= major_version di supabase/config.toml (server produksi).
  # pg_dump yang lebih tua dari server menolak jalan ("aborting because of server version mismatch").
  PG_MAJOR: "17"
  SCHEMAS: "public,app,audit"
  PGCONNECT_TIMEOUT: "25"

jobs:
  backup:
    # Dipin ke 24.04: label ubuntu-latest dijadwalkan pindah ke 26.04 pada Nov 2026
    # (actions/runner-images#14748). Pin menjaga baseline AWS CLI v2 + PostgreSQL 16 yang sudah diaudit.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Validate secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          set -euo pipefail
          for name in DB_URL AGE_RECIPIENT B2_APPLICATION_KEY_ID B2_APPLICATION_KEY B2_BUCKET B2_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name belum diset."
              exit 1
            fi
          done

      - name: Install backup tools
        run: |
          set -euo pipefail
          # AWS CLI v2 preinstalled di image ubuntu-24.04, tapi tidak dijamin oleh workflow ini.
          # Guard eksplisit: kalau image drift, gagal dengan pesan jelas (bukan error aws yang membingungkan).
          if ! command -v aws >/dev/null 2>&1; then
            echo "::error::aws CLI tidak tersedia di runner. Periksa label runs-on / image, atau pasang awscli v2."
            exit 1
          fi
          echo "aws: $(aws --version 2>&1)"

          sudo apt-get update
          sudo apt-get install -y age postgresql-client

          # PENTING: `supabase db dump` menjalankan pg_dump DI DALAM container CLI; versinya mengikuti
          # [db] major_version di supabase/config.toml, BUKAN binary host. Client host di bawah dipakai
          # untuk preflight (psql) dan fallback. Image ubuntu-24.04 membawa PostgreSQL 16, server kita 17.
          installed="$(pg_dump --version | sed -E 's/.* ([0-9]+)\.*/\1/')"
          if [ "${installed:-0}" -lt "$PG_MAJOR" ]; then
            echo "::notice::pg_dump host $installed < PG$PG_MAJOR; pasang postgresql-client-$PG_MAJOR dari PGDG."
            sudo apt-get install -y curl ca-certificates
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            sudo rm -f /etc/apt/sources.list.d/pgdg.list
            codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y "postgresql-client-${PG_MAJOR}"
          fi

          # Pin PATH ke binary versi target supaya tidak bergantung pada pemilihan versi pg_wrapper
          # (wrapper bisa memilih versi lain bila ada beberapa client terpasang).
          if [ -x "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" ]; then
            echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
            export PATH="/usr/lib/postgresql/${PG_MAJOR}/bin:$PATH"
          fi

          final="$(pg_dump --version | sed -E 's/.* ([0-9]+)\.*/\1/')"
          if [ "${final:-0}" -lt "$PG_MAJOR" ]; then
            echo "::error::pg_dump host masih $final (< PG$PG_MAJOR). Perbaiki sumber postgresql-client-$PG_MAJOR."
            exit 1
          fi
          echo "pg_dump: $(pg_dump --version)"
          echo "psql:    $(psql --version)"

      - name: Preflight connection check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # 1) Versi server: pg_dump harus >= mayor server, kalau tidak dump ditolak ("version mismatch").
          server_major="$(psql "$DB_URL" -At -c "show server_version" | cut -d. -f1)"
          echo "server major: ${server_major:-?} | client target: $PG_MAJOR"
          case "$server_major" in
            ''|*[!0-9]*)
              echo "::error::Tidak bisa membaca versi server dari SUPABASE_DB_URL (URL salah, pooler transaction mode, atau timeout)."
              exit 1 ;;
          esac
          if [ "$server_major" -gt "$PG_MAJOR" ]; then
            echo "::error::Server PG$server_major lebih baru dari client PG$PG_MAJOR. Naikkan PG_MAJOR dan [db] major_version di supabase/config.toml."
            exit 1
          fi

          # 2) Bypass RLS: allowlist KETAT. NULL/kosong/'restricted'/nilai tak dikenal semuanya DITOLAK,
          #    karena tanpa bypass, dump data diam-diam hanya memuat baris yang terlihat role itu.
          priv="$(psql "$DB_URL" -At -c "
            select case when rolsuper then 'super'
                        when rolbypassrls then 'bypass'
                        else 'restricted' end
            from pg_roles where rolname = current_user")"
          role="$(psql "$DB_URL" -At -c "select current_user")"
          echo "role=${role:-?} priv=${priv:-<kosong/NULL>}"
          case "$priv" in
            super|bypass)
              echo "Akses dump memadai: RLS dilewati, data tidak terpotong policy." ;;
            *)
              echo "::error::Role koneksi bukan superuser/bypassrls (hasil: '${priv:-<kosong/NULL>}'). Dump data akan dibatasi RLS dan tidak lengkap."
              exit 1 ;;
          esac

      - name: Dump schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          supabase db dump \
            --db-url "$DB_URL" \
            --schema "$SCHEMAS" \
            --file schema.sql

          supabase db dump \
            --db-url "$DB_URL" \
            --data-only \
            --use-copy \
            --schema "$SCHEMAS" \
            --file data.sql

          test -s schema.sql
          test -s data.sql

          # Integrity guard: test -s hanya membuktikan file tidak kosong, BUKAN dump lengkap.
          # Koneksi putus di tengah stream meninggalkan file terpotong yang tetap lolos test -s
          # tapi gagal/hang saat restore. pg_dump menandai selesai dengan baris komentar ini.
          for f in schema.sql data.sql; do
            if ! grep -q 'PostgreSQL database dump complete' "$f"; then
              echo "::error::$f tidak memuat marker 'PostgreSQL database dump complete' — dump terpotong/tidak selesai."
              exit 1
            fi
          done

          # --use-copy: tiap blok 'COPY ... FROM stdin;' wajib ditutup baris '\.'.
          # Jumlah tidak sama = ada stream COPY terpotong di tengah tabel (sebagian data hilang).
          copy_count="$(grep -cE '^COPY .* FROM stdin;$' data.sql || true)"
          dot_count="$(grep -cxF '\.' data.sql || true)"
          if [ "$copy_count" -ne "$dot_count" ]; then
            echo "::error::COPY ($copy_count) != terminator '\\.' ($dot_count) di data.sql — blok COPY terpotong."
            exit 1
          fi
          echo "Integrity OK: marker lengkap di schema+data; COPY=$copy_count terminator=$dot_count."

          cat schema.sql data.sql > backup.sql
          test -s backup.sql

          echo "Schema bytes: $(wc -c < schema.sql)"
          echo "Data bytes:   $(wc -c < data.sql)"
          echo "Combined:     $(wc -c < backup.sql)"
          echo "COPY/INSERT statements: $(grep -cE '^(COPY|INSERT) ' data.sql || true)"

      - name: Encrypt backup
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          age -r "$AGE_RECIPIENT" -o backup.sql.age backup.sql
          test -s backup.sql.age
          # Hapus plaintext PII segera setelah enkripsi. Kegagalan shred tidak boleh menggagalkan
          # backup yang sudah terenkripsi; fallback ke rm tetap menghilangkan file mentah.
          shred -u backup.sql schema.sql data.sql 2>/dev/null || rm -f backup.sql schema.sql data.sql

      - name: Upload to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          set -euo pipefail
          ENDPOINT="https://s3.${B2_REGION}.backblazeb2.com"
          KEY="backups/$(date -u +%F)-$(date -u +%H%M%S).sql.age"

          # B2 S3-compatible: path-style agar tidak bergantung DNS virtual-host bucket.
          aws configure set default.s3.addressing_style path
          aws s3 cp backup.sql.age "s3://${B2_BUCKET}/${KEY}" --endpoint-url "$ENDPOINT"
          # Bukti objek benar-benar landed, bukan hanya exit code cp.
          aws s3api head-object --bucket "$B2_BUCKET" --key "$KEY" --endpoint-url "$ENDPOINT"
          echo "Backup tersimpan: s3://${B2_BUCKET}/${KEY}"
          {
            echo "## IDAROH DB Backup"
            echo ""
            echo "- Objek: \`s3://${B2_BUCKET}/${KEY}\`"
            echo "- Ukuran terenkripsi: $(wc -c < backup.sql.age) bytes"
            echo "- Skema: ${SCHEMAS}"
          } >> "$GITHUB_STEP_SUMMARY"
