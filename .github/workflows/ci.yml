name: Pondok OS CI

on:
  push:
    branches: [main, master, "test/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Compile production build without deployment credentials
        run: npm run build
        env:
          IDAROH_BUILD_CONTEXT: ci-compile

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase secrets are not configured; migration check skipped."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start disposable Supabase
        run: supabase start
      - name: Apply all migrations from scratch
        run: supabase db reset --local --yes
      - name: Run RLS matrix
        run: supabase test db --local
      - name: Run review concurrency drill
        timeout-minutes: 5
        run: |
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            bash scripts/drill/review-concurrency.sh
      - name: Install application dependencies
        run: npm ci
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Export local Supabase credentials
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_EMAIL=e2e-active@example.test"
            echo "E2E_PASSWORD=Local-E2E-Password-2026"
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000"
            # DX-01: the typed reader opens a direct connection to the same disposable database the
            # app just seeded. Local Supabase serves plaintext on the pooled port, so TLS is off.
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "DX01_DB_URL=$DB_URL"
            echo "SUPABASE_DB_SSL_MODE=disable"
          } >> "$GITHUB_ENV"
      - name: Seed active E2E user
        run: npm run e2e:seed
      - name: Start application
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/idaroh-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/idaroh-next.log
          exit 1
      - name: Run browser E2E
        run: |
          if ! npm run test:e2e; then
            echo "----- Next.js server log -----"
            cat /tmp/idaroh-next.log
            exit 1
          fi
      - name: Verify DX-01 read parity against the live database
        run: |
          # The suite skips itself without DX01_DB_URL, so require it here: a missing export must fail
          # the gate instead of quietly dropping the only real Postgres proof of the read migration.
          if [ -z "$DX01_DB_URL" ]; then
            echo "DX01_DB_URL was not exported from supabase status."
            exit 1
          fi
          # tap, not the default reporter: vitest formats failures with Map.groupBy, which the Node 20
          # this job pins does not have — a failure would otherwise print only "Map.groupBy is not a
          # function" and hide every assertion diff.
          npx vitest run --reporter=tap src/__tests__/dx01-live-parity.test.ts
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
